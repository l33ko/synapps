/* SynApps — signalement des erreurs
   Les erreurs JavaScript rencontrées par les visiteurs sont envoyées, sans donnée personnelle, dans la table
   « erreurs » de Supabase (Synapps_public en production, Synapps_test ailleurs). Le robot de surveillance
   GitHub les relit chaque semaine. Au plus 5 envois par page ouverte. */
(function(){
  if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
  var B = /^(app\.synapsium\.com|synapps-bhl\.pages\.dev|l33ko\.github\.io)$/.test(location.hostname)
    ? {url:'https://qxwypwcxdhhtgmzaskzs.supabase.co', key:'sb_publishable_BZ9SxprfxkC-dUQZori4zA_txbvmngw'}
    : {url:'https://zlfgcfexvawijldgiqbu.supabase.co', key:'sb_publishable_aLCilH09KKWb4IfJC4Sx1g_df2_RUrC'};
  var n = 0, vus = {};
  function net(t, max){                                   // retire tout ce qui pourrait être personnel
    return String(t == null ? '' : t)
      .replace(/(https?:\/\/[^\s?#()'"]+)[?#][^\s()'"]*?(:\d+:\d+)?(?=[\s()'"]|$)/g, '$1$2')  // paramètres d'adresse (jetons, code d'invitation…)
      .replace(/(access_token|refresh_token|token|rejoindre|code)=[^&\s#"']+/gi, '$1=…')
      .replace(/[^\s@"'<>()\/:]+@[^\s@"'<>()\/:]+\.[a-z]{2,}/gi, '…@…')       // adresses e-mail
      .slice(0, max);
  }
  function app(){ var s = location.pathname.split('/')[1] || ''; return (!s || /\.html?$/.test(s)) ? 'accueil' : s.slice(0, 40); }
  function envoyer(msg, src, l, c, pile){
    msg = net(msg, 500); src = net(String(src || '').split(/[?#]/)[0], 300);
    if (!msg || /^Script error\.?$/i.test(msg)) return;                                       // erreur d'un autre site, sans détail
    if (/Failed to fetch|Load failed|NetworkError|network error|AbortError|The operation was aborted/i.test(msg)) return;  // réseau coupé
    if (/^(chrome|moz|safari|safari-web)-extension:/.test(src)) return;                       // extension du navigateur
    var k = msg + '|' + l; if (vus[k] || n >= 5) return; vus[k] = 1; n++;
    try {
      fetch(B.url + '/rest/v1/erreurs', {method:'POST', keepalive:true,
        headers:{apikey:B.key, 'Content-Type':'application/json', Prefer:'return=minimal'},
        body:JSON.stringify({app:app(), page:net(location.pathname, 200), message:msg, source:src,
          ligne:l | 0, colonne:c | 0, pile:net(pile, 2000), navigateur:String(navigator.userAgent).slice(0, 300)})
      }).catch(function(){});
    } catch(e){}
  }
  addEventListener('error', function(e){
    if (e.target && e.target !== window && !e.message) return;                                // image ou fichier qui ne charge pas
    envoyer(e.message, e.filename, e.lineno, e.colno, e.error && e.error.stack);
  }, true);
  addEventListener('unhandledrejection', function(e){
    var r = e.reason; envoyer(r && r.message || r, '', 0, 0, r && r.stack);
  });
})();
</script>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* =============================================================
   Recettes — SynApps
   Compte : e-mail + lien ou code (session commune aux apps SynApps).
   Données : projet Supabase public, protégées par les règles RLS
   (voir supabase.sql) : on ne voit que les recettes de ses familles.
   ============================================================= */
const SB = (/^(app\.synapsium\.com|synapps-bhl\.pages\.dev|l33ko\.github\.io)$/.test(location.hostname) ? {url:'https://qxwypwcxdhhtgmzaskzs.supabase.co',key:'sb_publishable_BZ9SxprfxkC-dUQZori4zA_txbvmngw'} : {url:'https://zlfgcfexvawijldgiqbu.supabase.co',key:'sb_publishable_aLCilH09KKWb4IfJC4Sx1g_df2_RUrC'});
const AUTH_KEY = 'synapps-auth';          // même session que le cahier du CP et Mon jardin
const FAM_KEY = 'recettes-famille';
const JOIN_KEY = 'recettes-rejoindre';
const APP_URL = location.origin + location.pathname;

const CATS = [
  ['Apéro','🫒'],['Entrée','🥗'],['Plat','🍲'],['Accompagnement','🥔'],['Dessert','🍰'],
  ['Petit-déj','🥐'],['Pain & pâte','🥖'],['Sauce','🫙'],['Boisson','🍹'],['Autre','🍽️']
];
const emoji = c => (CATS.find(x => x[0] === c) || [, '🍽️'])[1];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
const mins = m => !m ? '' : m < 60 ? `${m} min` : `${Math.floor(m/60)} h${m%60 ? ' ' + String(m%60).padStart(2,'0') : ''}`;
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const fmtCode = c => c ? c.slice(0, 3) + '-' + c.slice(3) : '';
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ---------- session (identique aux autres apps SynApps) ---------- */
let AUTH = store.get(AUTH_KEY);
function setAuth(r, extra = {}) {
  const u = r.user || {};
  AUTH = { access_token: r.access_token, refresh_token: r.refresh_token, exp: Date.now() + (r.expires_in || 3600) * 1000,
    email: u.email || extra.email || AUTH?.email || '', uid: u.id || extra.uid || AUTH?.uid || '' };
  store.set(AUTH_KEY, AUTH);
}
function logout() { AUTH = null; store.set(AUTH_KEY, null); }
async function authFetch(path, body) {
  const r = await fetch(SB.url + path, { method: body ? 'POST' : 'GET',
    headers: { apikey: SB.key, 'Content-Type': 'application/json', ...(AUTH && !body ? { Authorization: 'Bearer ' + AUTH.access_token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error(j?.msg || j?.message || j?.error_description || j?.error || 'HTTP ' + r.status); e.status = r.status; throw e; }
  return j;
}
let refreshing = null;
async function token() {
  if (!AUTH) throw new Error('non connecté');
  if (AUTH.exp - Date.now() < 60000) {
    refreshing ||= authFetch('/auth/v1/token?grant_type=refresh_token', { refresh_token: AUTH.refresh_token })
      .then(r => { setAuth(r); sb.realtime.setAuth(AUTH.access_token); })
      .catch(e => { if (e.status && e.status < 500) { logout(); route(); } throw e; })
      .finally(() => { refreshing = null; });
    await refreshing;
  }
  return AUTH.access_token;
}
const sb = createClient(SB.url, SB.key, { accessToken: async () => AUTH ? token() : null });
function authErr(e) {
  const m = e?.message || '';
  const sec = m.match(/after (\d+) seconds?/i);
  if (sec) return `Un e-mail vient déjà d’être envoyé. Attends ${sec[1]} secondes avant d’en redemander un.`;
  if (/email rate limit|over_email_send_rate_limit/i.test(m) || (e?.status === 429 && /email/i.test(m)))
    return 'Limite d’envoi d’e-mails atteinte pour l’instant. Réessaie dans un moment.';
  if (e?.status === 429 || /rate/i.test(m)) return 'Trop d’essais. Réessaie dans quelques minutes.';
  if (e?.status && e.status < 500 && /otp|token|expired|invalid/i.test(m)) return 'Code incorrect ou expiré. Vérifie-le ou redemande un e-mail.';
  return 'Connexion impossible. Vérifie internet et réessaie.';
}
function dbErr(e) {
  const m = e?.message || String(e);
  if (/schema cache|does not exist|Could not find the (table|function)/i.test(m))
    return 'La base n’est pas encore prête : lance le script recettes/supabase.sql dans Supabase.';
  if (/JWT|401|non connecté/i.test(m)) return 'Session expirée, reconnecte-toi.';
  return m;
}
const q = async p => { const { data, error } = await p; if (error) throw error; return data; };

/* ---------- état ---------- */
let familles = [], fam = null, membres = [], recipes = [], loaded = false, draft = null, channel = null, editing = false;
const filt = { q: '', cat: '', fav: false };
let wakeLock = null;

/* ---------- démarrage ---------- */
async function boot() {
  const qs = new URLSearchParams(location.search);
  const join = qs.get('rejoindre'), imp = qs.get('import');
  if (join) store.set(JOIN_KEY, join.toUpperCase().replace(/[^A-Z0-9]/g, ''));
  // Retour du lien magique : #access_token=…
  const h = location.hash;
  let linkMsg = '';
  if (/access_token=|error_code=/.test(h)) {
    const p = new URLSearchParams(h.slice(1));
    history.replaceState(null, '', location.pathname);
    if (p.get('access_token')) {
      AUTH = { access_token: p.get('access_token'), refresh_token: p.get('refresh_token') || '', exp: Date.now() + (+p.get('expires_in') || 3600) * 1000, email: '', uid: '' };
      try { const u = await authFetch('/auth/v1/user'); AUTH.email = u.email || ''; AUTH.uid = u.id || ''; store.set(AUTH_KEY, AUTH); }
      catch (e) { logout(); linkMsg = authErr(e); }
    } else linkMsg = 'Lien expiré ou déjà utilisé. Redemande un e-mail.';
  } else if (join || imp) history.replaceState(null, '', location.pathname + (imp ? '#/import' : location.hash));
  window.addEventListener('hashchange', route);
  window.addEventListener('storage', e => {
    if (e.key !== AUTH_KEY) return;
    const was = !!AUTH; AUTH = store.get(AUTH_KEY);
    if (!!AUTH !== was) { L.step = 1; loaded = false; route(); }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && loaded) reload(); });
  await route(linkMsg);
  if (imp && AUTH && loaded) renderImport(imp);
}

async function loadAll() {
  familles = await q(sb.rpc('mes_familles'));
  const saved = store.get(FAM_KEY);
  fam = familles.find(f => f.id === saved) || familles[0];
  store.set(FAM_KEY, fam?.id);
  await loadFamily();
}
async function loadFamily() {
  [recipes, membres] = await Promise.all([
    q(sb.from('recettes').select('*').eq('famille_id', fam.id).order('titre')),
    q(sb.from('membres_famille').select('user_id, role, email, created_at').eq('famille_id', fam.id).order('created_at')),
  ]);
  loaded = true;
  subscribe();
}
async function reload() {
  try { await loadAll(); rerender(); } catch {}
}
function subscribe() {
  if (channel) sb.removeChannel(channel);
  sb.realtime.setAuth(AUTH.access_token);
  channel = sb.channel('recettes-' + fam.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'recettes', filter: 'famille_id=eq.' + fam.id }, p => {
      if (p.eventType === 'DELETE') recipes = recipes.filter(r => r.id !== p.old?.id);
      else if (p.new?.famille_id === fam.id) {
        const i = recipes.findIndex(r => r.id === p.new.id);
        if (i >= 0) recipes[i] = p.new; else recipes.push(p.new);
        recipes.sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));
      }
      rerender(p.new?.id || p.old?.id);
    }).subscribe();
}
// Rafraîchit la vue après une modification venue d'un autre appareil (sauf pendant une saisie)
function rerender(id) {
  if (editing) return;
  const h = location.hash.slice(1) || '/';
  if (h === '/') { if (document.getElementById('res')) drawResults(); }
  else if (h === '/r/' + id) { const r = find(id); r ? renderDetail(r, true) : go('/'); }
  else if (h === '/famille' && !id) renderFamille();
}

async function route(msg = '') {
  releaseWake(); editing = false;
  if (!AUTH) return renderLogin(msg);
  if (!loaded) {
    app.innerHTML = '<div class="spin">Chargement des recettes…</div>';
    try { await loadAll(); }
    catch (e) { return renderError(e); }
    const pending = store.get(JOIN_KEY);
    if (pending) return renderJoin(pending);
  }
  const h = location.hash.slice(1) || '/';
  let m;
  if (h === '/new') renderEdit(null);
  else if (h === '/import') renderImport();
  else if (h === '/famille') renderFamille();
  else if (h === '/compte') renderCompte();
  else if ((m = h.match(/^\/edit\/(.+)$/))) find(m[1]) ? renderEdit(find(m[1])) : go('/');
  else if ((m = h.match(/^\/r\/(.+)$/))) renderDetail(find(m[1]));
  else renderList();
}
const find = id => recipes.find(r => r.id === id);
const go = h => { if (location.hash === '#' + h) route(); else location.hash = h; };
const who = uid => !uid ? '' : uid === AUTH?.uid ? 'toi' : (membres.find(m => m.user_id === uid)?.email || 'un ancien membre').split('@')[0];

const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  const words = norm(filt.q).split(/\s+/).filter(Boolean);
  const list = recipes.filter(r => {
    if (filt.fav && !r.favori) return false;
    if (filt.cat && r.categorie !== filt.cat) return false;
    if (!words.length) return true;
    const hay = norm([r.titre, r.categorie, r.ingredients, r.notes, (r.tags || []).join(' ')].join(' '));
    return words.every(w => hay.includes(w));
  });
  const res = document.getElementById('res');

    res.innerHTML = `<div class="empty"><div class="big">📖</div><p>Le carnet est vide pour l’instant.</p>

/* ---------- fiche recette ---------- */
const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1/3, '⅔': 2/3 };
function scaleLine(line, f) {
  const m = line.match(/^(\d+\s*\/\s*\d+|\d+(?:[.,]\d+)?(?:\s*[½¼¾⅓⅔])?|[½¼¾⅓⅔])/);
  if (!m) return esc(line);
  const t = m[1];
  let v;
  if (t.includes('/')) { const [a, b] = t.split('/').map(Number); v = a / b; }
  else if (FRAC[t]) v = FRAC[t];
  else { const fr = t.match(/[½¼¾⅓⅔]/); v = parseFloat(t.replace(',', '.')) + (fr ? FRAC[fr[0]] : 0); }
  const n = v * f;
  const out = n.toLocaleString('fr-FR', { maximumFractionDigits: n >= 10 ? 0 : n >= 1 ? 1 : 2 });
  return `<b>${f === 1 ? esc(t) : out}</b>${esc(line.slice(t.length))}`;
}

    </div>
    ${ings.length ? `<div class="panel">
      <h2>Ingrédients
        <span class="portions"><button id="minus" aria-label="Moins">−</button>
        <span id="por"></span><button id="plus" aria-label="Plus">+</button></span></h2>
      <ul class="ing" id="ing"></ul></div>` : ''}
    ${steps.length ? `<div class="panel"><h2>Préparation</h2>

        ? `<li class="sec">${esc(s.replace(/^—\s*|\s*—$/g, ''))}</li>` : `<li data-i="${i}" class="${S.st.has(i) ? 'done' : ''}">${esc(s)}</li>`).join('')}</ol></div>` : ''}

      : modif ? `<p class="muted by">Modifiée par ${esc(modif)}</p>` : ''}

  const drawIng = () => {

      <input type="checkbox" ${S.ing.has(i) ? 'checked' : ''}><span>${scaleLine(l, S.por / base)}</span></li>`).join('');
  };
  drawIng();
  const ingEl = document.getElementById('ing');
  if (ingEl) {
    ingEl.onclick = e => { const li = e.target.closest('li'); if (!li) return; const i = +li.dataset.i;

      </div>
      <button class="btn" id="go" style="width:100%">Importer la recette</button>
    </form>
    <div id="imsg"></div>
  </div>`;
  const f = document.getElementById('if'), msg = document.getElementById('imsg'), b = document.getElementById('go');

  if (p) p.onclick = async () => { try { const t = await navigator.clipboard.readText(); f.url.value = (t.match(/https?:\/\/\S+/) || [t])[0].trim(); } catch {} };

    try {
      await token();
      const { data, error } = await sb.functions.invoke('import-recette', { body: { url: f.url.value } });

        ? 'L’import n’est pas encore installé (fonction « import-recette » à créer dans Supabase).' : 'Le service d’import ne répond pas. Réessaie plus tard.');
      if (!data?.recette) { const er = new Error(data?.error || 'Import impossible.'); er.partiel = data?.partiel; throw er; }
      const rec = await q(sb.from('recettes').insert({ ...data.recette, famille_id: fam.id }).select().single());
      if (!find(rec.id)) recipes.push(rec);
      recipes.sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));
      go('/r/' + rec.id);
    } catch (err) {
      b.disabled = false;
      msg.innerHTML = `<div class="msg err">${esc(err.partiel !== undefined ? err.message : dbErr(err))}</div>` + (err.partiel

      const mb = document.getElementById('manual');
      if (mb) mb.onclick = () => { draft = err.partiel; go('/new'); };
    }
  };
  if (preset) f.requestSubmit(); else setTimeout(() => f.url.focus(), 50);
}

        <textarea name="ingredients" rows="8" placeholder="200 g de farine&#10;3 œufs&#10;1 pincée de sel">${esc(r.ingredients)}</textarea></div>
      <div class="f"><label>Étapes <span class="hint">— une par ligne</span></label>
        <textarea name="etapes" rows="8" placeholder="Préchauffer le four à 180 °C.&#10;Mélanger la farine et les œufs.">${esc(r.etapes)}</textarea></div>
      <div class="f"><label>Notes <span class="hint">(astuces, variantes…)</span></label><textarea name="notes" rows="3">${esc(r.notes)}</textarea></div>
      <div class="f"><label>Mots-clés <span class="hint">— séparés par des virgules</span></label><input type="text" name="tags" value="${esc((r.tags || []).join(', '))}" placeholder="rapide, végé, hiver"></div>
      <div class="f"><label>Lien vers la recette d’origine <span class="hint">(facultatif)</span></label><input type="url" name="source" value="${esc(r.source || '')}" placeholder="https://…"></div>
      <div class="f"><label>Lien vers une photo <span class="hint">(facultatif)</span></label><input type="url" name="photo" value="${esc(r.photo || '')}" placeholder="https://…"></div>
      <div id="emsg"></div>
      <div class="row-actions">
        <button class="btn">${isNew ? 'Ajouter la recette' : 'Enregistrer'}</button>
        ${isNew ? '' : '<button type="button" class="btn danger" id="del" style="margin-left:auto">Supprimer</button>'}
      </div>
    </form>
  </div>`;
  const f = document.getElementById('ef');
  f.onsubmit = async e => {
    e.preventDefault();
    const b = f.querySelector('.btn'); b.disabled = true;
    const num = v => v === '' ? null : parseInt(v, 10);
    const row = {
      titre: f.titre.value.trim(), categorie: f.categorie.value,
      portions: num(f.portions.value) || 4, temps_prep: num(f.temps_prep.value), temps_cuisson: num(f.temps_cuisson.value),
      ingredients: f.ingredients.value.trim(), etapes: f.etapes.value.trim(), notes: f.notes.value.trim(),
      tags: f.tags.value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 20),
      source: f.source.value.trim() || null, photo: f.photo.value.trim() || null,
    };
    try {
      const data = isNew
        ? await q(sb.from('recettes').insert({ ...row, famille_id: fam.id }).select().single())
        : await q(sb.from('recettes').update(row).eq('id', r.id).select().single());
      const i = recipes.findIndex(x => x.id === data.id);
      if (i >= 0) recipes[i] = data; else recipes.push(data);
      recipes.sort((a, b) => a.titre.localeCompare(b.titre, 'fr'));
      editing = false; go('/r/' + data.id);
    } catch (err) {
      b.disabled = false;
      document.getElementById('emsg').innerHTML = `<div class="msg err">${esc(dbErr(err))}</div>`;
    }
  };
  const del = document.getElementById('del');
  if (del) del.onclick = async () => {
    if (!confirm(`Supprimer « ${r.titre} » pour toute la famille ? C’est définitif.`)) return;
    try { await q(sb.from('recettes').delete().eq('id', r.id)); } catch (err) { return alert(dbErr(err)); }
    recipes = recipes.filter(x => x.id !== r.id);
    editing = false; go('/');
  };
  window.scrollTo(0, 0);
}

/* ---------- famille ---------- */
function renderFamille(msg = '') {
  const admin = fam.role === 'admin';
  const link = APP_URL + '?rejoindre=' + fam.code;
  app.innerHTML = `
  <div class="wrap">
    <div class="top"><a class="icon-btn" href="#/" title="Retour">←</a><h1 style="font-size:24px">Famille</h1></div>
    <div id="fmsg">${msg}</div>

    ${familles.length > 1 ? `<div class="panel"><h2>Mes familles</h2>
      <div class="fams">${familles.map(f => `<button class="famb ${f.id === fam.id ? 'on' : ''}" data-id="${f.id}">
        <b>${esc(f.nom)}</b><span>${f.nb_recettes} recette${f.nb_recettes > 1 ? 's' : ''} · ${f.nb_membres} membre${f.nb_membres > 1 ? 's' : ''}</span></button>`).join('')}</div></div>` : ''}

    <div class="panel">
      <h2>${esc(fam.nom)}</h2>
      ${admin ? `<form id="rn" class="imp"><input type="text" name="nom" maxlength="60" value="${esc(fam.nom)}" aria-label="Nom de la famille"><button class="btn ghost">Renommer</button></form>` : ''}
      <ul class="mem">${membres.map(m => `<li><span>${esc(m.email || '—')}${m.user_id === AUTH.uid ? ' <em>(toi)</em>' : ''}</span>
        <span class="muted">${m.role === 'admin' ? 'admin' : 'membre'}</span>
        ${admin && m.user_id !== AUTH.uid ? `<button class="btn danger rm" data-u="${m.user_id}" data-e="${esc(m.email || '')}">Retirer</button>` : ''}</li>`).join('')}</ul>
    </div>

    <div class="panel">
      <h2>Inviter quelqu’un</h2>
      <p class="muted" style="margin-top:0">Envoie ce lien. La personne se connecte avec son e-mail et voit aussitôt toutes les recettes de « ${esc(fam.nom)} ». Chacun peut ajouter, modifier ou supprimer des recettes.</p>
      <div class="code">${fmtCode(fam.code)}</div>
      <div class="row-actions" style="justify-content:center">
        <button class="btn" id="share">${navigator.share ? 'Partager le lien' : 'Copier le lien'}</button>
        ${admin ? '<button class="btn ghost" id="regen">Nouveau code</button>' : ''}
      </div>
      <p class="muted" id="cpmsg" style="text-align:center"></p>
    </div>

    <div class="panel">
      <h2>Rejoindre une autre famille</h2>
      <form id="jf" class="imp"><input type="text" name="code" placeholder="Code (ex. K7P-42Q)" autocapitalize="characters" maxlength="8"><button class="btn ghost">Rejoindre</button></form>
      <p class="muted" style="margin:14px 0 6px">ou</p>
      <button class="btn ghost" id="newf">➕ Créer une nouvelle famille</button>
    </div>

    <div class="panel">
      <button class="btn danger" id="quit" style="padding-left:0">Quitter « ${esc(fam.nom)} »</button>
      <p class="muted" style="margin:4px 0 0">${fam.nb_membres <= 1 ? 'Tu es le seul membre : quitter supprimera cette famille et ses recettes.' : 'Les recettes restent pour les autres membres.'}</p>
    </div>
  </div>`;
  const fmsg = t => { document.getElementById('fmsg').innerHTML = t; window.scrollTo(0, 0); };
  const err = e => fmsg(`<div class="msg err">${esc(dbErr(e))}</div>`);

  app.querySelectorAll('.famb').forEach(b => b.onclick = async () => {
    fam = familles.find(f => f.id === b.dataset.id); store.set(FAM_KEY, fam.id);
    app.innerHTML = '<div class="spin">Chargement…</div>';
    try { await loadFamily(); go('/'); } catch (e) { renderError(e); }
  });
  const rn = document.getElementById('rn');
  if (rn) rn.onsubmit = async e => {
    e.preventDefault(); const nom = rn.nom.value.trim(); if (!nom) return;
    try { await q(sb.from('familles').update({ nom }).eq('id', fam.id)); fam.nom = nom; renderFamille('<div class="msg info">Famille renommée.</div>'); }
    catch (e) { err(e); }
  };
  app.querySelectorAll('.rm').forEach(b => b.onclick = async () => {
    if (!confirm(`Retirer ${b.dataset.e || 'ce membre'} de la famille ? Il ne verra plus les recettes.`)) return;
    try { await q(sb.from('membres_famille').delete().eq('famille_id', fam.id).eq('user_id', b.dataset.u)); await loadAll(); renderFamille(); }
    catch (e) { err(e); }
  });
  document.getElementById('share').onclick = async () => {
    const text = `Rejoins « ${fam.nom} » sur l’app Recettes pour partager nos recettes : ${link}`;
    if (navigator.share) { try { await navigator.share({ title: 'Recettes', text, url: link }); } catch {} return; }
    try { await navigator.clipboard.writeText(link); document.getElementById('cpmsg').textContent = 'Lien copié ✔'; }
    catch { document.getElementById('cpmsg').textContent = link; }
  };
  const rg = document.getElementById('regen');
  if (rg) rg.onclick = async () => {
    if (!confirm('Créer un nouveau code ? L’ancien lien d’invitation ne fonctionnera plus (les membres actuels restent).')) return;
    try { fam.code = await q(sb.rpc('nouveau_code_famille', { f: fam.id })); renderFamille('<div class="msg info">Nouveau code créé.</div>'); }
    catch (e) { err(e); }
  };
  document.getElementById('jf').onsubmit = e => {
    e.preventDefault(); const c = e.target.code.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 6) return fmsg('<div class="msg err">Le code contient 6 caractères.</div>');
    renderJoin(c);
  };
  document.getElementById('newf').onclick = async () => {
    const nom = prompt('Nom de la nouvelle famille ?', 'Famille ');
    if (nom == null) return;
    try { const id = await q(sb.rpc('creer_famille', { p_nom: nom })); store.set(FAM_KEY, id); await loadAll(); go('/'); }
    catch (e) { err(e); }
  };
  document.getElementById('quit').onclick = async () => {
    const seul = fam.nb_membres <= 1;
    if (!confirm(seul ? `Tu es le seul membre : « ${fam.nom} » et ses ${recipes.length} recette(s) seront supprimées définitivement. Continuer ?`
      : `Quitter « ${fam.nom} » ? Tu ne verras plus ses recettes.`)) return;
    try { await q(sb.from('membres_famille').delete().eq('famille_id', fam.id).eq('user_id', AUTH.uid)); store.set(FAM_KEY, null); await loadAll(); go('/'); }
    catch (e) { err(e); }
  };
}

/* ---------- compte ---------- */
function renderCompte(msg = '') {
  app.innerHTML = `
  <div class="wrap">
    <div class="top"><a class="icon-btn" href="#/" title="Retour">←</a><h1 style="font-size:24px">Mon compte</h1></div>
    <div id="cmsg">${msg}</div>
    <div class="panel">
      <p style="margin-top:0">Connecté avec <b>${esc(AUTH.email)}</b>.</p>
      <p class="muted">Ce compte est commun aux apps SynApps (cahier du CP, Mon jardin…).</p>
      <div class="row-actions"><button class="btn ghost" id="out">Se déconnecter</button></div>
    </div>
    <div class="panel">
      <h2>Mes données</h2>
      <p class="muted" style="margin-top:0">Télécharge les recettes de « ${esc(fam.nom)} » dans un fichier, pour les garder ou les transférer.</p>
      <button class="btn ghost" id="exp">⬇ Exporter les recettes (.json)</button>
      <p class="muted"><a href="confidentialite.html">Confidentialité : quelles données, où, pour quoi</a></p>
    </div>
    <div class="panel">
      <h2>Supprimer mon compte</h2>
      <p class="muted" style="margin-top:0">Efface ton compte SynApps et toutes ses données (y compris celles des autres apps SynApps). Les familles dont tu es le seul membre sont supprimées avec leurs recettes ; dans les autres, les recettes restent pour les autres membres.</p>
      <button class="btn danger" id="del" style="padding-left:0">Supprimer mon compte</button>
    </div>
  </div>`;
  document.getElementById('out').onclick = () => {
    if (!confirm('Se déconnecter ? (Tu seras aussi déconnecté des autres apps SynApps sur cet appareil.)')) return;
    if (channel) sb.removeChannel(channel);
    logout(); loaded = false; go('/');
  };
  document.getElementById('exp').onclick = () => {
    const data = { app: 'synapps-recettes', version: 1, famille: fam.nom, exporte_le: new Date().toISOString(),
      recettes: recipes.map(({ id, famille_id, cree_par, modifie_par, ...r }) => r) };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
    a.download = `recettes-${norm(fam.nom).replace(/[^a-z0-9]+/g, '-')}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById('del').onclick = async () => {
    const t = prompt('Pour confirmer, écris SUPPRIMER');
    if (t?.trim().toUpperCase() !== 'SUPPRIMER') return;
    try { await q(sb.rpc('supprimer_mon_compte')); if (channel) sb.removeChannel(channel); logout(); loaded = false; renderLogin(); }
    catch (e) { document.getElementById('cmsg').innerHTML = `<div class="msg err">${esc(dbErr(e))}</div>`; }
  };
}
boot();
</script>
<script>
/* SynApps — nouvelle version disponible ?
   Le navigateur garde une copie des pages (jusqu'à 10 min sur GitHub Pages, parfois bien plus sur iPhone).
   On compare discrètement le code de la page affichée avec celui en ligne ; s'il a changé, on propose
   « Mettre à jour », qui recharge la page en contournant la copie gardée en mémoire. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  var KEY = 'synapps-maj:' + location.pathname, last = 0, shown = false;
  function sig(root){
    var t = '', els = root.querySelectorAll('script:not([src]),style');
    for (var i = 0; i < els.length; i++) if (!els[i].hasAttribute('data-runtime')) t += els[i].textContent;
    var h = 2166136261; for (var j = 0; j < t.length; j++){ h ^= t.charCodeAt(j); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '.' + t.length;
  }
  var mine = sig(document);
  function banner(){
    if (shown || document.getElementById('synappsMaj')) return; shown = true;
    var b = document.createElement('div'); b.id = 'synappsMaj';
    b.setAttribute('style', 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;z-index:2147483000;background:#25321e;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font:14px/1.3 system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)');
    b.innerHTML = '<span>Une nouvelle version est disponible</span><button type="button" style="border:0;border-radius:999px;padding:7px 14px;background:#8fd16a;color:#18240f;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer;white-space:nowrap">Mettre à jour</button><button type="button" aria-label="Plus tard" style="border:0;background:none;color:#cfd8c6;font-size:18px;cursor:pointer;padding:0 6px">×</button>';
    var bt = b.querySelectorAll('button');
    bt[0].onclick = function(){ location.replace(location.pathname + '?v=' + Date.now().toString(36) + location.hash); };
    bt[1].onclick = function(){ b.remove(); };
    document.body.appendChild(b);
  }
  function check(){
    var now = Date.now(); if (now - last < 5 * 60 * 1000) return; last = now;
    fetch(location.pathname + '?nocache=' + now.toString(36), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(html){
      if (!html) return;
      var theirs = sig(new DOMParser().parseFromString(html, 'text/html'));
      if (theirs === mine){ try { sessionStorage.removeItem(KEY); } catch(e){} return; }
      var tried = null; try { tried = sessionStorage.getItem(KEY); } catch(e){}
      if (tried === theirs) return;                    // déjà rechargé pour cette version : pas de boucle
      try { sessionStorage.setItem(KEY, theirs); } catch(e){}
      banner();
    }).catch(function(){});
  }
  // la page vient d'être rechargée par « Mettre à jour » : on nettoie l'adresse
  if (/[?&]v=/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){}
  setTimeout(check, 2500);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
})();
</script>
<script data-runtime>
/* SynApps — badge « Version test » (data-runtime : ignoré par la détection de nouvelle version, car lu après elle)
   Hors de la production (app.synapsium.com et sa copie synapps-bhl.pages.dev), la page est une version test :
   ses données en ligne vont dans le projet Supabase « Synapps_test », jamais dans les vraies données. */
(function(){
  if (!/^https?:$/.test(location.protocol) || /^(app\.synapsium\.com|synapps-bhl\.pages\.dev|l33ko\.github\.io)$/.test(location.hostname)) return;
  var b = document.createElement('div'); b.id = 'synappsTest'; b.textContent = 'Version test';
  b.title = 'Version test : les données en ligne vont dans Synapps_test, pas dans les vraies données.';
  b.setAttribute('style', 'position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2147482999;pointer-events:none;background:#f38020;color:#fff;border-radius:999px;padding:3px 10px;font:700 12px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.03em;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.92');
  (document.body || document.documentElement).appendChild(b);
})();
</script>
