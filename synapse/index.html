/* SynApps — signalement des erreurs
   Les erreurs JavaScript rencontrées par les visiteurs sont envoyées, sans donnée personnelle, dans la table
   « erreurs » de Supabase (Synapps_public en production, Synapps_test ailleurs). Le robot de surveillance
   GitHub les relit chaque semaine. Au plus 5 envois par page ouverte. */
(function(){
  if (!/^https?:$/.test(location.protocol) || !window.fetch) return;
  var B = /^(app\.synapsium\.com|synapps-bhl\.pages\.dev|l33ko\.github\.io)$/.test(location.hostname)
    ? {url:'https://qxwypwcxdhhtgmzaskzs.supabase.co', key:'sb_publishable_BZ9SxprfxkC-dUQZori4zA_txbvmngw'}
    : {url:'https://zlfgcfexvawijldgiqbu.supabase.co', key:'sb_publishable_aLCilH09KKWb4IfJC4Sx1g_df2_RUrC'};
  var n = 0, vus = {};
  function net(t, max){                                   // retire tout ce qui pourrait être personnel
    return String(t == null ? '' : t)
      .replace(/(https?:\/\/[^\s?#()'"]+)[?#][^\s()'"]*?(:\d+:\d+)?(?=[\s()'"]|$)/g, '$1$2')  // paramètres d'adresse (jetons, code d'invitation…)
      .replace(/(access_token|refresh_token|token|rejoindre|code)=[^&\s#"']+/gi, '$1=…')
      .replace(/[^\s@"'<>()\/:]+@[^\s@"'<>()\/:]+\.[a-z]{2,}/gi, '…@…')       // adresses e-mail
      .slice(0, max);
  }
  function app(){ var s = location.pathname.split('/')[1] || ''; return (!s || /\.html?$/.test(s)) ? 'accueil' : s.slice(0, 40); }
  function envoyer(msg, src, l, c, pile){
    msg = net(msg, 500); src = net(String(src || '').split(/[?#]/)[0], 300);
    if (!msg || /^Script error\.?$/i.test(msg)) return;                                       // erreur d'un autre site, sans détail
    if (/Failed to fetch|Load failed|NetworkError|network error|AbortError|The operation was aborted/i.test(msg)) return;  // réseau coupé
    if (/^(chrome|moz|safari|safari-web)-extension:/.test(src)) return;                       // extension du navigateur
    var k = msg + '|' + l; if (vus[k] || n >= 5) return; vus[k] = 1; n++;
    try {
      fetch(B.url + '/rest/v1/erreurs', {method:'POST', keepalive:true,
        headers:{apikey:B.key, 'Content-Type':'application/json', Prefer:'return=minimal'},
        body:JSON.stringify({app:app(), page:net(location.pathname, 200), message:msg, source:src,
          ligne:l | 0, colonne:c | 0, pile:net(pile, 2000), navigateur:String(navigator.userAgent).slice(0, 300)})
      }).catch(function(){});
    } catch(e){}
  }
  addEventListener('error', function(e){
    if (e.target && e.target !== window && !e.message) return;                                // image ou fichier qui ne charge pas
    envoyer(e.message, e.filename, e.lineno, e.colno, e.error && e.error.stack);
  }, true);
  addEventListener('unhandledrejection', function(e){
    var r = e.reason; envoyer(r && r.message || r, '', 0, 0, r && r.stack);
  });
})();

function genCalc(L){
 var t=rnd(100),a,b,c;
 if(L<=3){
  if(t<50){a=ri(2,12);b=ri(2,12);return{q:a+' + '+b,a:a+b}}
  a=ri(8,20);b=ri(2,a-2);return{q:a+' − '+b,a:a-b}}

  if(t<50){a=ri(12,69);b=ri(7,39);return{q:a+' + '+b,a:a+b}}
  a=ri(40,99);b=ri(7,Math.min(39,a-10));return{q:a+' − '+b,a:a-b}}
 if(L<=9){
  if(t<50){a=ri(2,9);b=ri(3,9);return{q:a+' × '+b,a:a*b}}
  if(t<75){a=ri(25,99);b=ri(12,60);return{q:a+' + '+b,a:a+b}}
  a=ri(60,150);b=ri(15,Math.min(59,a-15));return{q:a+' − '+b,a:a-b}}
 if(L<=12){
  if(t<40){a=ri(6,12);b=ri(6,12);return{q:a+' × '+b,a:a*b}}
  if(t<65){b=ri(3,12);c=ri(3,12);return{q:(b*c)+' ÷ '+b,a:c}}
  a=ri(120,480);b=ri(35,190);return{q:a+' + '+b,a:a+b}}
 if(L<=16){
  if(t<35){a=ri(3,9);b=ri(3,9);c=ri(4,30);return{q:c+' + '+a+' × '+b,a:c+a*b}}
  if(t<65){a=ri(12,25);b=ri(3,9);return{q:a+' × '+b,a:a*b}}
  if(t<85){b=ri(4,15);c=ri(6,19);return{q:(b*c)+' ÷ '+b,a:c}}
  a=ri(250,899);b=ri(120,Math.min(480,a-100));return{q:a+' − '+b,a:a-b}}
 if(t<30){a=ri(12,19);b=ri(12,19);return{q:a+' × '+b,a:a*b}}
 if(t<55){a=ri(2,12);c=ri(2,12);b=ri(3,9);return{q:'('+a+' + '+c+') × '+b,a:(a+c)*b}}
 if(t<80){a=ri(4,9);b=ri(4,9);c=ri(a*b+5,a*b+90);return{q:c+' − '+a+' × '+b,a:c-a*b}}

  okT=t.every(function(v){return Number.isInteger(v)&&v>0&&v<1000})&&t[5]!==t[4]
 }while(!okT&&k<60);

 cand=[lin,ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3,ans+5,ans*2];

/* Visuo-spatial : rotation de figures (cases pleines sur une grille) */
function rot90(p,n){var o=new Array(n*n),r,c;for(r=0;r<n;r++)for(c=0;c<n;c++)o[r*n+c]=p[(n-1-c)*n+r];return o}
function mirror(p,n){var o=new Array(n*n),r,c;for(r=0;r<n;r++)for(c=0;c<n;c++)o[r*n+c]=p[r*n+(n-1-c)];return o}
function rotN(p,n,k){for(var i=0;i<k;i++)p=rot90(p,n);return p}
function pstr(p){return p.join('')}
function moveCell(p){var x=p.slice(),on=[],off=[],i;for(i=0;i<x.length;i++)(x[i]?on:off).push(i);x[pick(on)]=0;x[pick(off)]=1;return x}
function genRot(L){
 var n=L<8?3:4,k=n===3?(L<4?4:5):(L<14?6:8),p,rs,set,ms,i;
 for(;;){
  p=[];for(i=0;i<n*n;i++)p.push(0);
  shuffle(p.map(function(_,i){return i})).slice(0,k).forEach(function(i){p[i]=1});
  rs=[p,rot90(p,n),rotN(p,n,2),rotN(p,n,3)];
  set={};rs.forEach(function(x){set[pstr(x)]=1});
  if(Object.keys(set).length<4)continue;
  ms=mirror(p,n);if(set[pstr(ms)])continue;
  break}
 var correct=rs[ri(1,3)],used={},opts=[correct],nm=L<6?0:(L<12?1:2),mr=[ms,rot90(ms,n),rotN(ms,n,2),rotN(ms,n,3)],tries=0,x;
 used[pstr(correct)]=1;
 shuffle(mr).forEach(function(m){if(opts.length<1+nm&&!used[pstr(m)]){opts.push(m);used[pstr(m)]=1}});
 while(opts.length<4&&tries++<500){
  x=moveCell(rs[ri(0,3)]);if(L<6)x=moveCell(x);
  if(set[pstr(x)]||used[pstr(x)])continue;
  opts.push(x);used[pstr(x)]=1}
 while(opts.length<4){x=moveCell(moveCell(moveCell(rs[ri(0,3)])));if(!set[pstr(x)]&&!used[pstr(x)]){opts.push(x);used[pstr(x)]=1}}
 var sh=shuffle(opts.map(function(o,i){return{o:o,c:i===0}}));
 return{n:n,target:p,opts:sh.map(function(s){return s.o}),ans:String(sh.findIndex(function(s){return s.c}))}}

/* Suivi : niveau recalculé à partir de l'historique */
function replay(runs){
 var lv={};EXIDS.forEach(function(id){lv[id]=START});
 runs.sort(function(a,b){return a.ts-b.ts});
 runs.forEach(function(r){var p=lv[r.ex]===undefined?START:lv[r.ex],v=clamp(p+r.dl,1,MAXLV);r.p=p;r.lv=v;lv[r.ex]=v});
 return lv}
function cleanRuns(a){return a.filter(function(r){return r&&typeof r.ts==='number'&&typeof r.dl==='number'&&typeof r.sc==='number'&&typeof r.d==='string'&&/^\d{4}-\d\d-\d\d$/.test(r.d)&&EXIDS.indexOf(r.ex)>-1}).map(function(r){return{ts:r.ts,d:r.d,ex:r.ex,sc:r.sc,ok:+r.ok||0,ko:+r.ko||0,dl:r.dl}})}
function mergeRuns(a,b){var m={},out=[],k;a.concat(b).forEach(function(r){m[r.ts+':'+r.ex]=r});for(k in m)out.push(m[k]);out.sort(function(x,y){return x.ts-y.ts});return out.slice(-800)}
function dayCounts(runs){var by={};runs.forEach(function(r){(by[r.d]=by[r.d]||{})[r.ex]=1});var out={};for(var k in by)out[k]=Object.keys(by[k]).length;return out}
function streakOf(runs,now){
 var by=dayCounts(runs),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),n=0;
 if((by[dateKey(d)]||0)<NEED)d.setDate(d.getDate()-1);
 while((by[dateKey(d)]||0)>=NEED){n++;d.setDate(d.getDate()-1)}
 return n}

/* Thèmes : niveau moyen, évolution, courbe */
function themeOf(ex){for(var i=0;i<THEMES.length;i++)if(THEMES[i].ex.indexOf(ex)>-1)return THEMES[i]}
function themeById(id){for(var i=0;i<THEMES.length;i++)if(THEMES[i].id===id)return THEMES[i]}
function meanLv(lv,th){var s=0;th.ex.forEach(function(id){s+=lv[id]});return s/th.ex.length}
function lvAt(runs,cut){return replay(runs.filter(function(r){return r.ts<=cut}).map(function(r){return{ts:r.ts,ex:r.ex,dl:r.dl}}))}
function hasRuns(runs,th){return runs.some(function(r){return th.ex.indexOf(r.ex)>-1})}
function themeDelta(runs,lvNow,th,now,days){
 if(!hasRuns(runs,th))return null;
 return meanLv(lvNow,th)-meanLv(lvAt(runs,now-days*86400000),th)}
function themeSeries(runs,th){
 var lv={},out=[];EXIDS.forEach(function(id){lv[id]=START});
 runs.slice().sort(function(a,b){return a.ts-b.ts}).forEach(function(r){
  lv[r.ex]=clamp((lv[r.ex]===undefined?START:lv[r.ex])+r.dl,1,MAXLV);
  if(th.ex.indexOf(r.ex)>-1){
   var p={ts:r.ts,d:r.d,v:meanLv(lv,th)};
   if(out.length&&out[out.length-1].d===r.d)out[out.length-1]=p;else out.push(p)}});
 return out}

function keypad(){var b='',j;for(j=1;j<=9;j++)b+='<button class="op" data-act="key" data-v="'+j+'">'+j+'</button>';return '<div class="kp">'+b+'<button class="op" data-act="key" data-v="del" aria-label="Effacer">Effacer</button><button class="op" data-act="key" data-v="0">0</button><span class="gap"></span></div>'}
function dcls(dl){return dl===null||Math.abs(dl)<0.05?'':dl>0?'up':'dn2'}

function spark(vs){
 if(vs.length<2)return '<svg class="sp" viewBox="0 0 90 28" aria-hidden="true"><line x1="4" y1="14" x2="86" y2="14" class="spd"/></svg>';
 var mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),r=Math.max(mx-mn,1),mid=(mn+mx)/2;
 var pts=vs.map(function(v,i){return(4+i*(82/(vs.length-1))).toFixed(1)+','+(14-(v-mid)/r*20).toFixed(1)}),last=pts[pts.length-1].split(',');
 return '<svg class="sp" viewBox="0 0 90 28" aria-hidden="true"><polyline points="'+pts.join(' ')+'" class="spl"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.8" class="spc"/></svg>'}

function ring(lv){
 var C=2*Math.PI*32,f=clamp((lv-1)/(MAXLV-1),0,1);
 return '<svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="rk" cx="40" cy="40" r="32"/><circle class="rv" cx="40" cy="40" r="32" stroke-dasharray="'+(f*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 40 40)"/><text class="rx" x="40" y="46.5" text-anchor="middle">'+fr(lv,1)+'</text></svg>'}

function chart(pts){
 var W=320,H=170,L=30,R=12,T=10,B=26,pw=W-L-R,ph=H-T-B,vs=pts.map(function(r){return r.v}),n=vs.length;
 var lo=Math.max(1,Math.floor(Math.min.apply(null,vs))-1),hi=Math.min(MAXLV,Math.ceil(Math.max.apply(null,vs))+1);
 if(hi-lo<4){hi=Math.min(MAXLV,lo+4);lo=Math.max(1,hi-4)}
 var step=(hi-lo)>10?5:((hi-lo)>5?2:1),s='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution du niveau du thème">',t,y,i,xy=[];
 for(t=Math.ceil(lo/step)*step;t<=hi;t+=step){y=T+ph-(t-lo)/(hi-lo)*ph;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" class="gl"/><text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" class="ax" text-anchor="end">'+t+'</text>'}
 for(i=0;i<n;i++){xy.push([n===1?L+pw/2:L+i*pw/(n-1),T+ph-(vs[i]-lo)/(hi-lo)*ph])}
 if(n>1)s+='<polyline class="cl" points="'+xy.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ')+'"/>';
 xy.forEach(function(p,i){s+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(i===n-1?4.5:3)+'" class="'+(i===n-1?'cdl':'cd')+'"/>'});
 if(n>1){s+='<text x="'+L+'" y="'+(H-6)+'" class="ax" text-anchor="start">'+ddmm(pts[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" class="ax" text-anchor="end">'+ddmm(pts[n-1].d)+'</text>'}
 else s+='<text x="'+(L+pw/2)+'" y="'+(H-6)+'" class="ax" text-anchor="middle">'+ddmm(pts[0].d)+'</text>';
 return s+'</svg>'}

function playTimed(e,L,cfg){
 var end=Date.now()+DUR*1000,ok=0,ko=0,item=null,lock=false;
 app.innerHTML='<div class="bk"><button class="lnk" data-act="home">Quitter</button><span class="ex">'+e.nom+' · '+e.jeu+'</span>'+sonBtn()+'</div><div class="tb"><i id="tb"></i></div><p class="hud"><span><b id="sc">0</b> juste</span><span id="tl">'+DUR+' s</span></p>'+(cfg.top||'')+'<div class="screen" id="stim"></div><div id="ctl"></div>';
 var stim=document.getElementById('stim'),ctl=document.getElementById('ctl'),tb=document.getElementById('tb'),sc=document.getElementById('sc'),tl=document.getElementById('tl');
 function nextItem(){item=cfg.next();cfg.show(item,stim,ctl);lock=false}
 function submit(good){if(lock)return;lock=true;sfx(good);if(good)ok++;else ko++;sc.textContent=ok;stim.classList.add(good?'good':'bad');later(160,function(){stim.classList.remove('good','bad');nextItem()})}
 CUR={handle:function(a,v){if(!lock&&item)cfg.handle(a,v,item,submit)},key:function(k){if(!lock&&item&&cfg.key)cfg.key(k,item,submit)}};
 nextItem();
 tickId=setInterval(function(){var left=end-Date.now();if(left<=0){clearInterval(tickId);tickId=null;endRun(e,{sc:ok,ok:ok,ko:ko,dl:dlTimed(ok,ko)});return}tb.style.width=(left/(DUR*10)).toFixed(1)+'%';tl.textContent=Math.ceil(left/1000)+' s'},100)}

/* Exercices à essais : Séquence (cases) et Chiffres */
function playMemoire(e,L){
 var g=memGrid(L),len0=memLen(L),len=len0,best=0,okT=0,koT=0,trial=0,seq=[],idx=0,accept=false,cells='',i;
 for(i=0;i<g*g;i++)cells+='<button class="cell" data-act="cell" data-v="'+i+'" aria-label="Case '+(i+1)+'"></button>';
 app.innerHTML='<div class="bk"><button class="lnk" data-act="home">Quitter</button><span class="ex">Mémoire · Séquence</span>'+sonBtn()+'</div><p class="hud"><span id="mt">Essai 1 sur 5</span><span id="ml">Longueur '+len+'</span></p><div class="screen"><div class="gr" id="gr" style="grid-template-columns:repeat('+g+',1fr)">'+cells+'</div></div><p class="mst" id="ms" aria-live="polite"> </p>';
 var btn=document.getElementById('gr').children,ms=document.getElementById('ms'),mt=document.getElementById('mt'),ml=document.getElementById('ml');
 function say(t){ms.textContent=t}
 function lit(c,on){btn[c].classList.toggle('lit',on)}
 function play(i){if(i>=seq.length){accept=true;say('À toi');return}lit(seq[i],true);later(memLit(L),function(){lit(seq[i],false);later(220,function(){play(i+1)})})}
 function nextTrial(){
  if(trial>=5||koT>=2){endRun(e,{sc:best,ok:okT,ko:koT,dl:dlMem(best,len0)});return}
  for(var q=0;q<btn.length;q++)btn[q].classList.remove('bad','tap','lit');
  trial++;seq=makeSeq(len,g*g);idx=0;accept=false;mt.textContent='Essai '+trial+' sur 5';ml.textContent='Longueur '+len;say('Regarde');
  later(500,function(){play(0)})}
 CUR={handle:function(a,v){
  if(a!=='cell'||!accept)return;
  var c=+v,b=btn[c];
  if(c===seq[idx]){
   b.classList.add('tap');later(180,function(){b.classList.remove('tap')});
   idx++;
   if(idx===seq.length){accept=false;sfx(true);okT++;best=Math.max(best,len);len++;say('Juste');later(800,nextTrial)}
   else sfxTap(c);
  }else{accept=false;sfx(false);koT++;b.classList.add('bad');len=Math.max(2,len-1);say('Raté');later(1000,nextTrial)}}};
 nextTrial()}

function playChiffres(e,L){
 var len0=digLen(L),len=len0,best=0,okT=0,koT=0,trial=0,seq=[],buf='',accept=false,tdig=digShow(L);
 app.innerHTML='<div class="bk"><button class="lnk" data-act="home">Quitter</button><span class="ex">Mémoire · Chiffres</span>'+sonBtn()+'</div><p class="hud"><span id="mt">Essai 1 sur 5</span><span id="ml">Longueur '+len+'</span></p><div class="screen"><span class="qa" id="dg"> </span></div><p class="mst" id="ms" aria-live="polite"> </p><div id="ctl">'+keypad()+'</div>';
 var dg=document.getElementById('dg'),ms=document.getElementById('ms'),mt=document.getElementById('mt'),ml=document.getElementById('ml');
 function say(t){ms.textContent=t}
 function showBuf(){dg.textContent=buf?buf.split('').join(' '):' '}
 function play(i){if(i>=seq.length){dg.textContent=' ';accept=true;buf='';say('Tape les chiffres');return}dg.textContent=seq[i];later(tdig,function(){dg.textContent=' ';later(200,function(){play(i+1)})})}
 function nextTrial(){
  if(trial>=5||koT>=2){endRun(e,{sc:best,ok:okT,ko:koT,dl:dlMem(best,len0)});return}
  trial++;seq=makeSeq(len,10);buf='';accept=false;mt.textContent='Essai '+trial+' sur 5';ml.textContent='Longueur '+len;say('Regarde');dg.textContent=' ';
  later(600,function(){play(0)})}
 function press(k){
  if(!accept)return;
  if(k==='del'){buf=buf.slice(0,-1);showBuf();return}
  if(!/^\d$/.test(k)||buf.length>=seq.length)return;
  buf+=k;showBuf();
  if(buf.length===seq.length){
   accept=false;
   if(buf===seq.join('')){sfx(true);okT++;best=Math.max(best,len);len++;say('Juste');later(800,nextTrial)}
   else{sfx(false);koT++;len=Math.max(2,len-1);say('Raté. C’était '+seq.join(' '));later(1600,nextTrial)}}}
 CUR={handle:function(a,v){if(a==='key')press(v)},key:function(k){press(k==='Backspace'?'del':k)}};
 nextTrial()}

 if(a==='sync'){syncNow();return}

 if(a==='verify'){verifyCode();return}
 if(a==='back'){ACC.step=1;ACC.msg='';render();return}

<script>
/* SynApps — nouvelle version disponible ?
   Le navigateur garde une copie des pages (jusqu'à 10 min sur GitHub Pages, parfois bien plus sur iPhone).
   On compare discrètement le code de la page affichée avec celui en ligne ; s'il a changé, on propose
   « Mettre à jour », qui recharge la page en contournant la copie gardée en mémoire. */
(function(){
  if (!/^https?:$/.test(location.protocol)) return;
  var KEY = 'synapps-maj:' + location.pathname, last = 0, shown = false;
  function sig(root){
    var t = '', els = root.querySelectorAll('script:not([src]),style');
    for (var i = 0; i < els.length; i++) if (!els[i].hasAttribute('data-runtime')) t += els[i].textContent;
    var h = 2166136261; for (var j = 0; j < t.length; j++){ h ^= t.charCodeAt(j); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + '.' + t.length;
  }
  var mine = sig(document);
  function banner(){
    if (shown || document.getElementById('synappsMaj')) return; shown = true;
    var b = document.createElement('div'); b.id = 'synappsMaj';
    b.setAttribute('style', 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;z-index:2147483000;background:#25321e;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font:14px/1.3 system-ui,-apple-system,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px)');
    b.innerHTML = '<span>Une nouvelle version est disponible</span><button type="button" style="border:0;border-radius:999px;padding:7px 14px;background:#8fd16a;color:#18240f;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer;white-space:nowrap">Mettre à jour</button><button type="button" aria-label="Plus tard" style="border:0;background:none;color:#cfd8c6;font-size:18px;cursor:pointer;padding:0 6px">×</button>';
    var bt = b.querySelectorAll('button');
    bt[0].onclick = function(){ location.replace(location.pathname + '?v=' + Date.now().toString(36) + location.hash); };
    bt[1].onclick = function(){ b.remove(); };
    document.body.appendChild(b);
  }
  function check(){
    var now = Date.now(); if (now - last < 5 * 60 * 1000) return; last = now;
    fetch(location.pathname + '?nocache=' + now.toString(36), {cache:'no-store'}).then(function(r){ return r.ok ? r.text() : null; }).then(function(html){
      if (!html) return;
      var theirs = sig(new DOMParser().parseFromString(html, 'text/html'));
      if (theirs === mine){ try { sessionStorage.removeItem(KEY); } catch(e){} return; }
      var tried = null; try { tried = sessionStorage.getItem(KEY); } catch(e){}
      if (tried === theirs) return;                    // déjà rechargé pour cette version : pas de boucle
      try { sessionStorage.setItem(KEY, theirs); } catch(e){}
      banner();
    }).catch(function(){});
  }
  // la page vient d'être rechargée par « Mettre à jour » : on nettoie l'adresse
  if (/[?&]v=/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){}
  setTimeout(check, 2500);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(); });
})();
</script>
<script data-runtime>
/* SynApps — badge « Version test » (data-runtime : ignoré par la détection de nouvelle version, car lu après elle)
   Hors de la production (app.synapsium.com et sa copie synapps-bhl.pages.dev), la page est une version test :
   ses données en ligne vont dans le projet Supabase « Synapps_test », jamais dans les vraies données. */
(function(){
  if (!/^https?:$/.test(location.protocol) || /^(app\.synapsium\.com|synapps-bhl\.pages\.dev|l33ko\.github\.io)$/.test(location.hostname)) return;
  var b = document.createElement('div'); b.id = 'synappsTest'; b.textContent = 'Version test';
  b.title = 'Version test : les données en ligne vont dans Synapps_test, pas dans les vraies données.';
  b.setAttribute('style', 'position:fixed;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:2147482999;pointer-events:none;background:#f38020;color:#fff;border-radius:999px;padding:3px 10px;font:700 12px/1.4 system-ui,-apple-system,sans-serif;letter-spacing:.03em;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:.92');
  (document.body || document.documentElement).appendChild(b);
})();
</script>
